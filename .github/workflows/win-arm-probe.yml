name: win-arm-probe

# Manual probe: can a public windows-11-arm runner build Flutter's Windows
# target at all? Kept out of build.yml until it is known to work.
on:
  workflow_dispatch:

jobs:
  windows-arm:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      - name: Build
        run: flutter build windows --release
      - name: Inspect the produced binaries
        run: |
          Get-ChildItem build\windows -Recurse -Filter *.exe | Select-Object FullName, Length
          $exe = Get-ChildItem build\windows -Recurse -Filter tallynote.exe | Select-Object -First 1
          if ($exe) {
            $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            "PE machine: 0x{0:X4} (0xAA64 = arm64, 0x8664 = x64)" -f $machine
          }
      - uses: actions/upload-artifact@v4
        with:
          name: tallynote-windows-arm64
          path: build/windows/**/Release/**
